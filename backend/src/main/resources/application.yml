spring:
  application:
    name: huilerie-erp
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/huilerie_erp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:huilerie_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate        # Hibernate ne modifie jamais le schéma : Flyway s'en charge
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP   # Instant -> DATETIME(6), identique sur MySQL et H2
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET}                       # obligatoire, 32 caractères minimum
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap:
    admin-username: ${ADMIN_INITIAL_USERNAME:}
    admin-password: ${ADMIN_INITIAL_PASSWORD:}
    admin-first-name: ${ADMIN_INITIAL_FIRST_NAME:Administrateur}
    admin-last-name: ${ADMIN_INITIAL_LAST_NAME:Principal}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
